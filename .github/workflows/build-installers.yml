name: Build OwnLedger Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:win
            artifact: windows
          - os: macos-latest
            command: npm run dist:mac
            artifact: macos
          - os: ubuntu-latest
            command: npm run dist:linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run core tests
        run: npm test
      - name: Build installer
        run: ${{ matrix.command }}
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OwnLedger-${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd installers
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installers/*
          generate_release_notes: true
