name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug", "needs-reproduction"]
body:
  - type: markdown
    attributes:
      value: "Do not report security vulnerabilities here; use private vulnerability reporting."
  - type: input
    id: version
    attributes: {label: OwnLedger version}
    validations: {required: true}
  - type: dropdown
    id: os
    attributes: {label: Operating system, options: [Windows, macOS, Linux, Other]}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
  - type: textarea
    id: actual
    attributes: {label: Actual behavior}
    validations: {required: true}
