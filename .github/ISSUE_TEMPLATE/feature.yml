name: Feature request
description: Propose an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem to solve}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed solution}
    validations: {required: true}
  - type: checkboxes
    id: network
    attributes:
      label: Architecture
      options:
        - label: This proposal would require network access (explain why)
